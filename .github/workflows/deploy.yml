name: Deploy Frontend to AWS Lightsail

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        if [ -f "package-lock.json" ]; then
          npm ci
        else
          echo "⚠️ package-lock.json not found, generating it..."
          npm install --package-lock-only
          npm ci
        fi
      
    - name: Build project
      run: npm run build
      env:
        NEXT_PUBLIC_BACKEND_BASE_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_BASE_URL }}
        NEXT_PUBLIC_Site_URL: ${{ secrets.NEXT_PUBLIC_Site_URL }}
        NODE_ENV: production

    - name: Prepare Directory on AWS Lightsail
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_PRIVATE_KEY }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          sudo mkdir -p /var/www/techmapperz-frontend-prod
          sudo chown -R $USER:$USER /var/www/techmapperz-frontend-prod

    - name: Upload files to AWS Lightsail
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_PRIVATE_KEY }}
        port: ${{ secrets.VPS_PORT }}
        source: ".next,public,package.json,package-lock.json,next.config.mjs"
        target: "/var/www/techmapperz-frontend-prod/"
        overwrite: true
      
    - name: Deploy to AWS Lightsail
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_PRIVATE_KEY }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          # Navigate to project directory
          cd /var/www/techmapperz-frontend-prod
          
          # Create .env file with environment variables
          cat > .env << EOF
          NEXT_PUBLIC_BACKEND_BASE_URL=${{ secrets.NEXT_PUBLIC_BACKEND_BASE_URL }}
          NEXT_PUBLIC_Site_URL=${{ secrets.NEXT_PUBLIC_Site_URL }}
          NODE_ENV=production
          PORT=3001
          EOF
          
          # Export environment variables for build process
          export NEXT_PUBLIC_BACKEND_BASE_URL="${{ secrets.NEXT_PUBLIC_BACKEND_BASE_URL }}"
          export NEXT_PUBLIC_Site_URL="${{ secrets.NEXT_PUBLIC_Site_URL }}"
          export NODE_ENV=production
          export NODE_OPTIONS="--max-old-space-size=1536"
          export PORT=3001
          
          # Install production dependencies
          echo "📥 Installing dependencies..."
          npm install --production
          
          echo "✅ Using pre-built application from GitHub Actions"
          
          # Verify build exists (should be included from GitHub Actions)
          if [ ! -d ".next" ]; then
            echo "❌ .next directory not found. Build should be included in repository."
            echo "Make sure GitHub Actions build step completed successfully."
            exit 1
          fi
          
          echo "✅ Build verification successful"
          
          # Stop existing PM2 process and start new one
          echo "🔄 Restarting frontend application..."
          pm2 stop techmapperz-frontend 2>/dev/null || echo "No existing process to stop"
          pm2 delete techmapperz-frontend 2>/dev/null || echo "No existing process to delete"
          
          # Kill any process using port 3001 (multiple methods for reliability)
          echo "🔍 Checking for processes on port 3001..."
          PORT_PROCESS=$(lsof -ti:3001 2>/dev/null || echo "")
          if [ -n "$PORT_PROCESS" ]; then
            echo "⚠️ Found process(es) using port 3001: $PORT_PROCESS"
            lsof -ti:3001 | xargs kill -9 2>/dev/null || true
            fuser -k 3001/tcp 2>/dev/null || true
          else
            echo "✅ Port 3001 is free"
          fi
          
          # Wait a moment for port to be released
          sleep 5
          
          # Verify port is free before starting
          if lsof -i:3001 >/dev/null 2>&1; then
            echo "⚠️ Warning: Port 3001 is still in use after cleanup. Listing processes..."
            lsof -i:3001 || true
            echo "⚠️ Attempting aggressive cleanup..."
            lsof -ti:3001 | xargs kill -9 2>/dev/null || true
            fuser -k 3001/tcp 2>/dev/null || true
            sleep 3
          fi
          
          # Final check
          if lsof -i:3001 >/dev/null 2>&1; then
            echo "❌ ERROR: Port 3001 is still in use. Cannot start frontend."
            echo "Please manually free port 3001."
            exit 1
          fi
          
          # Start the frontend with PM2
          pm2 start npm --name "techmapperz-frontend" -- start
          pm2 save
          
          echo "✅ Deployment completed successfully!"
          pm2 status techmapperz-frontend